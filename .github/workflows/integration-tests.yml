# The interaction tests (playwright.config.ts) against a real SilverBullet, the
# version scripts/silverbullet/Dockerfile names, on a push to main and on a pull
# request, beside unit-tests.yml. Dependabot offers each new SilverBullet in a pull
# request (.github/dependabot.yml), which these tests then run against: green, it
# merges by itself (dependabot.yml in this folder); red, the repository's owner is
# assigned to it, which GitHub tells them.
# Each plugin's tests (<plugin>/ui-tests/) in a job of its own, and each area a
# plugin keeps in a folder under it (silverware-table/ui-tests/sheet/: the sheet
# view's) in one of its own (scripts/ui-test-groups.mjs), side by side on runners
# of their own, each with the workers and SilverBullet servers a run had: the run
# takes as long as its largest group, a new plugin or area gets its job by its
# folder, and no runner is loaded more than one was (more workers on one made the
# tests flaky). Tests (silverbullet), which main's rule requires, passes once
# every group's does.
# Run by hand (Actions > Integration tests > Run workflow), the target and the
# image can be chosen (the playground, or another SilverBullet: ghcr.io/silverbulletmd/silverbullet:latest-slim).
# Each group's job summary has the counts and the tests that failed; its HTML
# report (each test's error, screenshot, trace and browser console) and
# SilverBullet's log are artifacts of the run, by the group's name.
name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: What the tests run against
        type: choice
        options: [silverbullet, playground]
        default: silverbullet
      image:
        description: Another SilverBullet image than scripts/silverbullet/Dockerfile names (target silverbullet)
        default: ""

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  groups:
    name: Groups of interaction tests
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: echo "list=$(node scripts/ui-test-groups.mjs)" >> "$GITHUB_OUTPUT"

  group:
    name: Tests (${{ inputs.target || 'silverbullet' }}) ${{ matrix.group.name }}
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each group's outcome, whatever another's
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.list) }}
    env:
      SW_TARGET: ${{ inputs.target || 'silverbullet' }}
      SB_IMAGE: ${{ inputs.image }}
      SW_SB_LOGS: ${{ github.workspace }}/silverbullet-log
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright's Chromium (the version Playwright pins) kept between runs by that version; the system's libraries
      # it needs installed each run, as they are the runner's
      - name: Playwright's version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright's Chromium, kept
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Playwright's Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: SilverBullet image
        if: env.SW_TARGET == 'silverbullet'
        run: |
          image="${SB_IMAGE:-$(sed -n 's/^FROM \([^ ]*\).*/\1/p' scripts/silverbullet/Dockerfile)}"
          docker pull "$image"
          version=$(docker run --rm --entrypoint /silverbullet "$image" --version)
          echo "Testing against \`$image\`: $version" >> "$GITHUB_STEP_SUMMARY"

      # (Playwright takes the filter as a regular expression of the test files' paths; given through the environment, as the shell would read its $)
      - name: Interaction tests
        env:
          FILTER: ${{ matrix.group.filter }}
        run: node scripts/ui-tests.mjs "$SW_TARGET" "$FILTER"

      - name: HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ env.SW_TARGET }}-${{ matrix.group.id }}
          path: playwright-report/
          retention-days: 14

      - name: SilverBullet's log
        if: ${{ !cancelled() && env.SW_TARGET == 'silverbullet' }}
        uses: actions/upload-artifact@v7
        with:
          name: silverbullet-log-${{ matrix.group.id }}
          path: silverbullet-log/
          retention-days: 14
          if-no-files-found: ignore

  # The check main's rule requires (its name as it was before the tests were split): every group's tests passed
  test:
    name: Tests (${{ inputs.target || 'silverbullet' }})
    needs: group
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To assign the owner to a Dependabot pull request the tests fail on
      issues: write
      pull-requests: write
    steps:
      - name: Every group's tests passed
        env:
          RESULT: ${{ needs.group.result }}
        run: |
          echo "The groups' tests: $RESULT"
          test "$RESULT" = "success"

      # A new SilverBullet that breaks the tests: its pull request stays open, the owner assigned (GitHub tells them), once
      - name: The owner assigned to the Dependabot pull request
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          OWNER: ${{ github.repository_owner }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR" --add-assignee "$OWNER"
          gh pr comment "$PR" --body "The interaction tests fail against this SilverBullet: $RUN (each group's report and SilverBullet's log are its artifacts)."
