# The unit tests and the other checks of npm run verify (types, the bundles matching their
# sources) on a push to main and on a pull request, beside integration-tests.yml.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types, unit tests, bundles match their sources
        run: npm run verify
