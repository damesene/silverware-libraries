<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silverware Toolbar playground</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="toolbar-playground.css" />
  </head>
  <body>
    <header>
      <strong>Silverware Toolbar<span class="long"> playground</span></strong>
      <nav class="playgrounds" aria-label="Playgrounds">
        <a href="./">Table</a>
        <a href="toolbar.html" aria-current="page">Toolbar</a>
      </nav>
      <span class="hint">Mock SilverBullet: a CodeMirror editor of markdown, as SilverBullet's; select text, or Ctrl-Shift-q</span>
      <span class="spacer"></span>
      <button id="reset" type="button" title="Reset sample"><span class="icon">↺</span><span class="label">Reset sample</span></button>
      <button id="theme" type="button" title="Dark / light"><span class="icon">◐</span><span class="label">Dark / light</span></button>
    </header>
    <main id="sb-main">
      <div id="sb-editor"></div>
    </main>
    <div id="flash" aria-live="polite"></div>
    <script type="module" src="toolbar.js"></script>
  </body>
</html>
